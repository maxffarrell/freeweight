# Set persistent BETTER_AUTH_SECRET and POSTGRES_PASSWORD in .env before starting.
# POSTGRES_PASSWORD must be URL-safe (for example, `openssl rand -hex 32`).
services:
  app:
    image: freeweight:local
    build: .
    pull_policy: build
    env_file:
      - path: .env
        required: false
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgres://freeweight:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/freeweight
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      FREEWEIGHT_ENTERPRISE_KEY: ${FREEWEIGHT_ENTERPRISE_KEY:-}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: freeweight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: freeweight
    volumes: ['pgdata:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U freeweight']
      interval: 5s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
