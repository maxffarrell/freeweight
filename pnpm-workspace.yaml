packages:
  - .
  - packages/*

allowBuilds:
  esbuild: true

overrides:
  # drizzle-kit's deprecated @esbuild-kit loader pins esbuild <0.25 (GHSA-67mh-4wv8-2f99).
  '@esbuild-kit/core-utils>esbuild': ^0.25.12
  # typescript-estree pins minimatch 10.x (GHSA-g3hv-75wg-m249); patched in >=11.0.1.
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1

# Reject Node runtimes without the CVE-2026-111497 security fix.
engineStrict: true
