# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/maxffarrell/freeweight
services:
  - type: web
    name: freeweight
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: freeweight-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true

databases:
  - name: freeweight-db
    plan: free
    postgresMajorVersion: '18'
