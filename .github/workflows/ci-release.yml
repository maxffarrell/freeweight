name: CI and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag to redeploy (for example v0.0.2)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-release-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.release_ref || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.12.1'
      - id: plan
        run: node scripts/release/plan.ts
  version:
    concurrency:
      group: changesets-version-${{ github.repository }}
      cancel-in-progress: false
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.deploy != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.12.1'
      - run: npm install -g pnpm@12.4.1
      - uses: changesets/action@v1
        with:
          version: pnpm release:version
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  reserve:
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Reserve immutable release tag before the build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$RELEASE_VERSION" -f sha="$SOURCE_COMMIT" >/dev/null
          fi
  build:
    needs: [plan, reserve]
    if: always() && needs.plan.result == 'success' && (github.event_name == 'pull_request' || (needs.plan.outputs.deploy == 'true' && needs.reserve.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    services:
      postgres:
        image: postgres:18-alpine@sha256:b6972e1115a4ff8eba5d7f7d19184926d1e16d7d1136ae1e1a7ebf286da0f015
        # Disposable runner-local test database, never production credentials.
        env:
          POSTGRES_USER: demo_test
          POSTGRES_PASSWORD: runner-test-only
          POSTGRES_DB: demo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.12.1'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
      - name: Validate application and release safeguards
        # Isolated CI-only database/auth fixtures; real credentials use secrets contexts.
        env:
          DATABASE_URL: postgres://demo_test:runner-test-only@localhost:5432/demo_test
          BETTER_AUTH_SECRET: runner-test-only
          FREEWEIGHT_DEMO: 'false'
        run: |
          npm install -g pnpm@12.4.1
          pnpm install --frozen-lockfile
          pnpm check
          pnpm lint
          node scripts/migrate.ts
          pnpm test $(git ls-files '*.test.ts' '*.spec.ts' | sed '/\.it\.test\.ts$/d')
          (cd scripts/release && go test ./...)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: needs.plan.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image on GitHub runner
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ needs.plan.outputs.deploy == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}:v${{ needs.plan.outputs.version }}
            ghcr.io/${{ github.repository }}:sha-${{ needs.plan.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  release:
    needs: [plan, build]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Record successful release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          # Anchor the validated image commit before creating release metadata.
          # Main can advance (including workflow edits) while an image is building.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$RELEASE_VERSION" -f sha="$SOURCE_COMMIT" >/dev/null
          fi
          if ! gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --verify-tag --title "v$RELEASE_VERSION" --generate-notes
          fi
  deploy:
    needs: [plan, build]
    if: needs.plan.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: demo
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - name: Deploy immutable image and verify demo
        env:
          DEMO_SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: cd scripts/release && go run ./send
