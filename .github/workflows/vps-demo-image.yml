name: Build VPS demo image
on:
  push:
    branches: [codex/vps-demo-image]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: demo_test
          POSTGRES_PASSWORD: runner-test-only
          POSTGRES_DB: demo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U demo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install and validate app
        env:
          DATABASE_URL: postgres://demo_test:runner-test-only@localhost:5432/demo_test
          BETTER_AUTH_SECRET: build-placeholder
        run: |
          npm install -g pnpm@12.4.1
          pnpm install --frozen-lockfile
          pnpm exec prettier --write .
          pnpm check
          pnpm lint
          node scripts/migrate.ts
          # Demo seeding smoke test uses the fresh runner database; gift-card fixtures are separate.
          pnpm test $(git ls-files '*.test.ts' '*.spec.ts' | sed '/\.it\.test\.ts$/d')
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:latest
          outputs: type=docker,dest=/tmp/demo-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image for VPS deployment
        uses: actions/upload-artifact@v4
        with:
          name: demo-image
          path: /tmp/demo-image.tar
          retention-days: 1
          compression-level: 0
