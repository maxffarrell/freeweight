name: Build VPS demo image
on:
  push:
    branches: [codex/vps-demo-image]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install and validate app
        env:
          DATABASE_URL: postgres://build@localhost/build
          BETTER_AUTH_SECRET: build-placeholder
        run: |
          npm install -g pnpm@12.4.1
          pnpm install --frozen-lockfile
          pnpm exec prettier --write src/lib/server/auth.ts 'src/routes/(auth)/login/+page.svelte'
          pnpm check
          pnpm lint
          pnpm test
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}:latest
          outputs: type=docker,dest=/tmp/demo-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image for VPS deployment
        uses: actions/upload-artifact@v4
        with:
          name: demo-image
          path: /tmp/demo-image.tar
          retention-days: 1
          compression-level: 0
